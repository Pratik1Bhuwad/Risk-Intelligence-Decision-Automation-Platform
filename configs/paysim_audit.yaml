dataset: paysim
audit_version: "0.1.0"
data_path: data/raw/paysim/PaySimData.csv
output_dir: audit_output

columns:
  temporal:
    - step

  categorical:
    - type

  entities:
    origin:
      - nameOrig
    destination:
      - nameDest

  numerical:
    - amount
    - oldbalanceOrg
    - newbalanceOrig
    - oldbalanceDest
    - newbalanceDest

  target:
    - isFraud

  flags:
    - isFlaggedFraud

audit_settings:
  missing_markers:
    - "null"
    - "nan"
    - "none"
    - "na"
    - "?"
    - "missing"
    - "n/a"
    - ""
  quantiles:
    - 0.01
    - 0.05
    - 0.10
    - 0.25
    - 0.50
    - 0.75
    - 0.90
    - 0.95
    - 0.99
  chunk_size: 100000
